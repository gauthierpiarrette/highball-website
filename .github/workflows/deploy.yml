name: Build and deploy
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [db-updated]
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Check out compatibility data
        uses: actions/checkout@v4
        with:
          repository: gauthierpiarrette/highball-db
          path: .highball-db
      - name: Restore Steam catalog cache
        uses: actions/cache@v4
        with:
          path: .cache/steam.json
          key: steam-catalog-v1-${{ github.run_id }}
          restore-keys: |
            steam-catalog-v1-
      - name: Refresh game artwork and store metadata
        run: python3 scripts/sync-steam.py --db .highball-db
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static website
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 build.py --db .highball-db --out dist --base "$BASE_URL"
      - name: Check generated website
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/check.py --db .highball-db --out dist --base "$BASE_URL"
          node scripts/check-language.mjs
          python3 -m unittest discover -s tests
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
