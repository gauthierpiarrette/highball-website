name: Build and deploy

on:
  push:
    branches: [main]
  # highball-db can trigger a content rebuild:
  #   gh api repos/gauthierpiarrette/highball-website/dispatches -f event_type=db-updated
  repository_dispatch:
    types: [db-updated]
  # Catch data changes even if nobody dispatches. Hourly, not daily: highball-db pushes a
  # db-updated dispatch when its WEBSITE_DISPATCH_TOKEN secret is set, and this is the fallback
  # for when it is not. A day of lag meant the database could be right while the page people
  # read was wrong, which is the one thing this site cannot afford.
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Check out highball-db
        uses: actions/checkout@v4
        with:
          repository: gauthierpiarrette/highball-db
          path: .highball-db

      - name: Build
        run: python3 build.py --db .highball-db --out dist

      - name: Sanity check the output
        run: |
          set -e
          test -s dist/index.html
          test -s dist/database/index.html
          test -s dist/sitemap.xml
          test -s dist/CNAME
          test -s dist/data/predictions.json
          # every curated game in the db must have produced a page
          expected=$(ls .highball-db/db/games/*.json | wc -l | tr -d ' ')
          # count game dirs that are NOT noindex (curated pages only)
          actual=$(grep -L 'name="robots" content="noindex' dist/games/*/index.html | wc -l | tr -d ' ')
          echo "curated pages: $actual (db entries: $expected)"
          test "$actual" -eq "$expected"
          # the sitemap must never contain a noindex page
          ! grep -qE '<loc>[^<]*/games/' dist/sitemap.xml || \
            for u in $(grep -oE '/games/[^<]*' dist/sitemap.xml); do
              grep -q 'noindex' "dist${u}index.html" && { echo "noindex page in sitemap: $u"; exit 1; } || true
            done
          # every curated game with a Steam app id has a lookup file, and it parses as curated
          python3 - <<'EOF'
          import glob, json, os, sys
          ids = [json.load(open(f)).get("steam_appid") for f in glob.glob(".highball-db/db/games/*.json")]
          ids = [i for i in ids if i]
          missing = [i for i in ids if not os.path.exists(f"dist/data/steam/{i}.json")]
          if missing:
              sys.exit(f"lookup files missing for {len(missing)} curated games, e.g. {missing[:5]}")
          rec = json.load(open(f"dist/data/steam/{ids[0]}.json"))
          if rec["kind"] != "curated" or rec["game"]["steam_appid"] != ids[0]:
              sys.exit(f"lookup file for {ids[0]} is not the curated record: {rec}")
          print(f"steam lookups: {len(glob.glob('dist/data/steam/*.json'))} ({len(ids)} curated)")
          EOF
          echo "OK"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
